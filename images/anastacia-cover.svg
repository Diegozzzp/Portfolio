<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="80"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#g1)"/>

  <circle cx="200" cy="150" r="180" fill="#14b8a6" opacity="0.15" filter="url(#blur)"/>
  <circle cx="1500" cy="900" r="220" fill="#8b5cf6" opacity="0.12" filter="url(#blur)"/>
  <circle cx="1300" cy="200" r="160" fill="#06b6d4" opacity="0.12" filter="url(#blur)"/>

  <g transform="translate(800,520)">
    <g transform="translate(-180,-120) scale(1.2)">
      <rect x="0" y="40" rx="18" ry="18" width="360" height="220" fill="#0b1326" stroke="url(#accent)" stroke-width="3"/>
      <rect x="30" y="70" rx="10" ry="10" width="300" height="160" fill="#0f1b3d" stroke="#1f305a" stroke-width="2"/>
      <circle cx="320" cy="60" r="6" fill="#22d3ee"/>
      <circle cx="70" cy="150" r="48" fill="#111a33" stroke="#334155" stroke-width="4"/>
      <rect x="230" y="120" rx="6" ry="6" width="70" height="18" fill="#111a33"/>
      <rect x="230" y="150" rx="6" ry="6" width="70" height="18" fill="#111a33"/>
      <rect x="230" y="180" rx="6" ry="6" width="70" height="18" fill="#111a33"/>
      <circle cx="70" cy="150" r="22" fill="url(#accent)" opacity="0.85"/>
    </g>
  </g>

  <text x="800" y="820" text-anchor="middle" fill="#e5e7eb" font-family="'Roboto', Arial, sans-serif" font-size="64" font-weight="700">Portafolio Fotógrafa</text>
  <text x="800" y="870" text-anchor="middle" fill="#a1a1aa" font-family="'Roboto', Arial, sans-serif" font-size="22" font-weight="400">Vista previa temporal</text>
</svg>
