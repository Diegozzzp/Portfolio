<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1200" viewBox="0 0 1920 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="50%" stop-color="#0e1429"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1460 280) rotate(45) scale(680 420)">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(320 940) rotate(45) scale(780 520)">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1920" height="1200" fill="url(#bg)"/>
  <rect width="1920" height="1200" fill="url(#grid)"/>

  <ellipse cx="1460" cy="280" rx="540" ry="320" fill="url(#glow)" filter="url(#softBlur)"/>
  <ellipse cx="320" cy="940" rx="620" ry="400" fill="url(#glow2)" filter="url(#softBlur)"/>

  <!-- Camera frame -->
  <g transform="translate(600,280)">
    <rect x="0" y="0" width="720" height="480" rx="24" fill="#0c1324" stroke="url(#accent)" stroke-width="3"/>
    <rect x="36" y="48" width="648" height="384" rx="16" fill="#0f1b3d" stroke="#1f305a" stroke-width="2"/>
    <circle cx="90" cy="420" r="10" fill="#14b8a6"/>
    <circle cx="630" cy="60" r="8" fill="#22d3ee"/>
  </g>

  <!-- Lens -->
  <g transform="translate(820,430)">
    <circle cx="0" cy="0" r="110" fill="#0d1326" stroke="#28334f" stroke-width="6"/>
    <circle cx="0" cy="0" r="84" fill="#0a1224"/>
    <circle cx="0" cy="0" r="54" fill="#101b37"/>
    <circle cx="-14" cy="-18" r="18" fill="#22d3ee" opacity="0.7"/>
    <circle cx="22" cy="16" r="10" fill="#8b5cf6" opacity="0.6"/>
  </g>

  <!-- Title -->
  <text x="960" y="1040" text-anchor="middle" fill="#E5E7EB" font-family="'Roboto', Arial, sans-serif" font-size="70" font-weight="700" letter-spacing="0.5">Portafolio Fotógrafa</text>
  <rect x="730" y="1065" width="460" height="10" rx="5" fill="url(#accent)" opacity="0.85"/>
</svg>
